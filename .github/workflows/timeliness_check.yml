name: Timeliness Check

on:
  schedule:
    - cron: '0 9 * * *'  # every day at 09:00 UTC
  workflow_dispatch:         # also allows manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: timeliness-check
  cancel-in-progress: false  # wait for current run to finish, don't overlap

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # a batch of 200 runs ~25 min at 7s a record; the cap is
                             # there to kill a stall, not to bound normal work

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # About one reachable project site in ten paints its text in the browser
      # and serves a shell to a plain fetch, so those get re-read through
      # chromium. Measured at roughly 5s a render and ~20 renders a batch, on
      # top of a download of about half a minute here. The scorer falls back to
      # recording such a page as unread if this step is removed or the browser
      # cannot start, so the run does not depend on it.
      - name: Install chromium for reading script-rendered pages
        run: python -m playwright install --with-deps chromium

      - name: Run timeliness check
        env:
          AIRTABLE_PAT:    ${{ secrets.AIRTABLE_PAT }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}  # built-in ephemeral token; read-only per permissions block
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python timeliness_check.py
